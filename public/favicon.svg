<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Dark background -->
  <rect width="64" height="64" fill="#050a05"/>
  <!-- Outer hexagon -->
  <polygon
    points="32,4 56,18 56,46 32,60 8,46 8,18"
    fill="none"
    stroke="#00ff41"
    stroke-width="2"
  />
  <!-- Inner hexagon -->
  <polygon
    points="32,10 50,21 50,43 32,54 14,43 14,21"
    fill="rgba(0,255,65,0.07)"
    stroke="rgba(0,255,65,0.4)"
    stroke-width="1"
  />
  <!-- RC text -->
  <text
    x="32"
    y="37"
    text-anchor="middle"
    font-family="'Orbitron', 'Arial', sans-serif"
    font-weight="700"
    font-size="16"
    fill="#00ff41"
    letter-spacing="1"
  >RC</text>
</svg>
